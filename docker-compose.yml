services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:full-rocm
    container_name: llama.cpp
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ${LLAMA_MODELS:-${HOME}/llama-cpp-models}:/models:ro

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    entrypoint: /app/llama-server

    command:
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --models-preset
      - /run/configs/models.ini
      - --models-max
      - "1"

    configs:
      - source: llama-model-presets
        target: /run/configs/models.ini

configs:
  llama-model-presets:
    content: |
      version = 1

      [qwen3.5]
      model = /models/Qwen3.5-9B-Q8_0.gguf
      alias = Qwen3.5
      c = 98304
      n-gpu-layers = 999
      flash-attn = on
      jinja = true
      load-on-startup = false

      [qwen3.8]
      model = /models/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      alias = Qwen3.8-gsq-rco
      c = 98304
      n-gpu-layers = 999
      flash-attn = on
      cache-type-k = q4_0
      cache-type-v = q4_0
      jinja = true
      parallel = 1
      batch-size = 512
      ubatch-size = 128
      spec-type = draft-mtp
      spec-draft-n-max = 3
      load-on-startup = false
